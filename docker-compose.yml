# PostgreSQL local para desarrollo. En producción se usa Cloud SQL.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gemeseg
      POSTGRES_PASSWORD: gemeseg
      POSTGRES_DB: capacitador
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
