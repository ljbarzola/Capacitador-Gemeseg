# Cloud Build: construye la imagen, la sube a Artifact Registry y despliega a Cloud Run.
# Se dispara desde un trigger de GitHub sobre la rama main (ver docs/02-gcp-setup.md).
#
# El paso "migrate" aplica las migraciones de Prisma antes de desplegar. La imagen
# standalone no incluye el CLI de Prisma, asi que se corre aqui con el Cloud SQL Auth
# Proxy abriendo el mismo socket /cloudsql que usa Cloud Run (la URL del secreto es valida).
substitutions:
  _REGION: us-east1
  _REPO: capacitador
  _SERVICE: capacitador-gemeseg
  _SQL_INSTANCE: capacitaciongemeseg:us-east1:capacitador-db # PROYECTO:REGION:INSTANCIA
  # Config pública de Firebase (consola > Configuración del proyecto > Tus apps). Los valores
  # reales se definen como sustituciones del activador, no en el repositorio.
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: ""
  _FIREBASE_PROJECT_ID: ""
  _FIREBASE_STORAGE_BUCKET: ""
  _FIREBASE_MESSAGING_SENDER_ID: ""
  _FIREBASE_APP_ID: ""

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

  - id: migrate
    name: node:24-alpine
    entrypoint: sh
    secretEnv: [DATABASE_URL]
    args:
      - -c
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        mkdir -p /cloudsql
        wget -q -O /usr/local/bin/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64
        chmod +x /usr/local/bin/cloud-sql-proxy
        cloud-sql-proxy --unix-socket /cloudsql ${_SQL_INSTANCE} &
        for i in $(seq 1 30); do
          [ -S /cloudsql/${_SQL_INSTANCE}/.s.PGSQL.5432 ] && break
          sleep 1
        done
        npm ci
        npx prisma migrate deploy

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --cpu-boost
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY
